# Clear-speech majority-case profile (recommended)
#
# Purpose:
#   Maximize target-speech clarity across everyday mixtures while still covering
#   loud background music that partially obscures the speaker.
#
# Derived from:
#   - pipeline_awesome_gan_curriculum_speech_only.toml
#   - the dedicated background-music dataset convention in docs/CONVENTIONS.md
#
# Design notes:
#   - Keeps dynamic_loss on pipeline_awesome so the run uses the direct
#     speech-preservation + music-suppression objective in training_losses.py.
#   - Enables the improved proxy gates so low-energy and low-SNR speech frames
#     get extra gradient weight instead of being treated uniformly.
#   - Starts music exposure a bit earlier, but still ramps it in gradually, so
#     the model sees partially masked speech before the late curriculum phases.
#   - Pushes more weight into the speech-clarity stages and the speech-band VAD
#     refinement term, while keeping the late GAN phase slightly restrained.
#   - Retains dedicated background-music coverage without over-biasing the run
#     toward music-heavy mixtures in the majority of batches.
#
# Usage:
#   python -m df_mlx.train_dynamic \
#     --run-config DeepFilterNet/df_mlx/configs/run_profiles/pipeline_awesome_gan_curriculum_clear_speech.toml
#
# Notes:
#   - For cache-backed runs, build the cache with a dedicated background-music
#     corpus.
#   - For raw file-list runs, override dataset.music_list (or pass --music-list)
#     with background_music.txt from your dataset prep step.

[dataset]
cache_dir = "~/DataDump/datasets/new2_mlx_datastore"
p_background_music = 0.45
background_music_gain_range = [0, 16]

[training]
epochs = 220
batch_size = 22
learning_rate = 1e-4
learning_rate_min = 1e-7
weight_decay = 0.0
warmup_epochs = 10
patience = 0
grad_accumulation_steps = 2
max_grad_norm = 1.0
fp16 = true
seed = 42
music_start_epoch = 40
music_ramp_epochs = 16

[dataloader]
num_workers = 18
prefetch_size = 25
use_mlx_data = true

[checkpoint]
checkpoint_dir = "/Users/andrew/DataDump/checkpoints/clear_speech_3"
save_strategy = "epoch"
save_total_limit = 5
validate_every = 1
checkpoint_batches = 300
check_chkpts = false
resume = true
resume_data = true

[model]
backbone_type = "attention"
variant = "full"

[loss]
dynamic_loss = "pipeline_awesome"

[[loss.pipeline_stages]]
start_epoch = 0
name = "foundation"
awesome_loss_weight = 0.20
vad_loss_weight = 0.08
vad_speech_loss_weight = 0.06

[[loss.pipeline_stages]]
start_epoch = 50
name = "ramp"
awesome_loss_weight = 0.55
vad_loss_weight = 0.22
vad_speech_loss_weight = 0.18

[[loss.pipeline_stages]]
start_epoch = 100
name = "clarity_peak"
awesome_loss_weight = 0.85
vad_loss_weight = 0.30
vad_speech_loss_weight = 0.40

[[loss.pipeline_stages]]
start_epoch = 170
name = "gan_refine"
awesome_loss_weight = 0.72
vad_loss_weight = 0.24
vad_speech_loss_weight = 0.30

[loss.awesome]
loss_weight = 0.85
mask_sharpness = 5.5
warmup_steps = 1800
proxy_enabled = true

[loss.contrastive_silence]
# Inherited from contrastive_awesome:
speech_frames_per_sample = 32
speech_mask_min = 0.7

# New silence-specific:
silence_frames_per_sample = 32
silence_mask_max = 0.3
silence_weight = 0.8           # relative weight of silence term vs speech contrastive
asymmetric_penalty = 2.5       # extra weight for residual-above-clean
transition_blend_range = [0.3, 0.7]  # VAD mask range for soft blending
low_freq_boost = 1.5           # extra silence weight below 300 Hz

[loss.mrstft]
factor = 0.35
gamma = 0.7
f_complex = 0.15
fft_sizes = [512, 1024, 2048]
hop_sizes = [128, 256, 512]

[gan]
enabled = true
start_epoch = 170
ramp_epochs = 24
adv_weight = 0.08
fm_weight = 0.6
discriminator = "combined"
mpd_periods = [2, 3, 5, 7, 11]
msd_scales = 3
disc_lr = 2e-5
disc_weight_decay = 0.01
disc_grad_clip = 1.0
disc_update_freq = 2
disc_max_samples = 24000
mpd_channels = 16
msd_channels = 64
cache_gen_waveforms = true
disc_gradient_checkpoint = true
gen_gradient_checkpoint = true
eval_frequency = 6

[vad]
loss_weight = 0.3
threshold = 0.05
margin = 0.04
speech_loss_weight = 0.35
warmup_epochs = 5
snr_gate_db = -14.0
snr_gate_width = 6.0
band_low_hz = 300.0
band_high_hz = 3400.0
z_threshold = 0.0
z_slope = 1.0

[vad.eval]
mode = "silero"
every = 2
batches = 24
max_seconds = 10.0
silero_sample_rate = 16000

[vad.train]
prob = 0.1
every_steps = 2

[metrics]
eval_sisdr = false

[debug]
verbose = false
sync_mode = "fast"
debug_numerics = false
debug_numerics_fail_fast = true
debug_numerics_every = 1
debug_numerics_dump_dir = ""
debug_numerics_dump_arrays = false
debug_numerics_max_dumps = 5
nan_skip_batch = false

[enhance]
speech_boost_db = 4.5
speech_boost_threshold = 0.35
speech_boost_min_speech_ms = 220
speech_boost_min_silence_ms = 90
speech_boost_pad_ms = 40
speech_boost_ramp_ms = 10.0
speech_boost_peak_limit = 0.99
speech_boost_silero_sample_rate = 16000
