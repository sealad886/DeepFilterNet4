# E1: MPD-only reduced discriminator experiment
# Based on run_pipeline_awesome_gan_silero_single_oom_safe.toml
# Removes MSD entirely (98% of disc params), keeps reduced MPD.
# Expected: ~715x fewer disc params, ~90% GAN compute savings, 90-95% quality retention.
#
# Usage:
#   python -m df_mlx.train_dynamic \
#     --run-config DeepFilterNet/df_mlx/configs/run_profiles/mpd_only_reduced.toml

[dataset]
cache_dir = "/Users/andrew/DataDump/datasets/mlx_datastore"

[training]
epochs = 100
batch_size = 12
learning_rate = 1e-6
weight_decay = 0.0
warmup_epochs = 5
patience = 10
grad_accumulation_steps = 2
max_grad_norm = 0.8
fp16 = true
seed = 42

[dataloader]
num_workers = 8
prefetch_size = 12
use_mlx_data = true

[checkpoint]
checkpoint_dir = "/Users/andrew/DataDump/checkpoints/e1_mpd_only_reduced"
save_strategy = "epoch"
validate_every = 1
checkpoint_batches = 200
check_chkpts = false
resume = true
resume_data = true

[model]
backbone_type = "attention"
variant = "full"

[loss]
dynamic_loss = "pipeline_awesome"

[loss.awesome]
loss_weight = 0.4
mask_sharpness = 6.0
warmup_steps = 2000
proxy_enabled = false

[loss.mrstft]
factor = 0.2
gamma = 0.7
f_complex = 0.15
fft_sizes = [512, 1024, 2048]
hop_sizes = [128, 256, 512]

[gan]
enabled = true
start_epoch = 20
ramp_epochs = 12
adv_weight = 0.08               # Slight bump to compensate for smaller disc
fm_weight = 1.5                  # Bump FM to compensate for fewer feature maps
discriminator = "mpd"            # MPD-only: drops MSD (~231M params)
mpd_periods = [2, 3, 5]         # 3 periods (was 5): sufficient for speech periodicity
mpd_channels = 16               # Halved: OOM-safe proven
disc_lr = 1e-5
disc_weight_decay = 0.01
disc_grad_clip = 1.0
disc_update_freq = 2
disc_max_samples = 48000
cache_gen_waveforms = true
disc_gradient_checkpoint = true
eval_frequency = 4

[vad]
loss_weight = 0.05
threshold = 0.1
margin = 0.05
speech_loss_weight = 0.01
warmup_epochs = 5
snr_gate_db = -10.0
snr_gate_width = 6.0
band_low_hz = 300.0
band_high_hz = 3400.0
z_threshold = 0.0
z_slope = 1.0

[vad.eval]
mode = "silero"
every = 2
batches = 4
max_seconds = 0.0
