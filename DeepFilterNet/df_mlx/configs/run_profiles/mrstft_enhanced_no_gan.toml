# E2: Enhanced MRSTFT, no GAN experiment
# Based on run_pipeline_awesome_gan_silero_single_oom_safe.toml
# GAN disabled entirely. MRSTFT boosted with more resolutions and higher weights.
# Expected: 0% disc param overhead, 80-90% quality retention, maximum throughput.
#
# Usage:
#   python -m df_mlx.train_dynamic \
#     --run-config DeepFilterNet/df_mlx/configs/run_profiles/mrstft_enhanced_no_gan.toml

[dataset]
cache_dir = "/Users/andrew/DataDump/datasets/mlx_datastore"
p_background_music = 0.35
background_music_gain_range = [0, 16]

[training]
epochs = 100
batch_size = 12
learning_rate = 1e-6
weight_decay = 0.0
warmup_epochs = 5
patience = 10
grad_accumulation_steps = 2
max_grad_norm = 0.8
fp16 = true
seed = 42
music_start_epoch = 30
music_ramp_epochs = 10

[dataloader]
num_workers = 8
prefetch_size = 12
use_mlx_data = true

[checkpoint]
checkpoint_dir = "/Users/andrew/DataDump/checkpoints/e2_mrstft_enhanced_no_gan"
save_strategy = "epoch"
validate_every = 1
checkpoint_batches = 200
check_chkpts = false
resume = true
resume_data = true

[model]
backbone_type = "attention"
variant = "full"

[loss]
dynamic_loss = "pipeline_awesome"

[loss.awesome]
loss_weight = 0.4
mask_sharpness = 6.0
warmup_steps = 2000
proxy_enabled = false

[loss.mrstft]
factor = 0.5                     # Increased from 0.2 (compensate for no GAN)
gamma = 0.6                      # More compression (closer to perceptual)
f_complex = 0.3                  # Doubled from 0.15 (better phase capture)
fft_sizes = [256, 512, 1024, 2048, 4096]  # 5 resolutions (was 3)
hop_sizes = [64, 128, 256, 512, 1024]

[gan]
enabled = false

[vad]
loss_weight = 0.05
threshold = 0.1
margin = 0.05
speech_loss_weight = 0.01
warmup_epochs = 5
snr_gate_db = -10.0
snr_gate_width = 6.0
band_low_hz = 300.0
band_high_hz = 3400.0
z_threshold = 0.0
z_slope = 1.0

[vad.eval]
mode = "silero"
every = 2
batches = 4
max_seconds = 0.0
