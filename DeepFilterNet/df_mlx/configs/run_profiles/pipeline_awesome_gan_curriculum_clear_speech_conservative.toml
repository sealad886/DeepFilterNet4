# Clear-speech majority-case profile (conservative variant)
#
# Purpose:
#   Provide a lower-risk alternative to the retuned clear-speech profile while
#   still using pipeline_awesome and dedicated loud-background-music coverage.
#
# Derived from:
#   - pipeline_awesome_gan_curriculum_clear_speech.toml
#   - pipeline_awesome_gan_curriculum_clear_speech_original.toml
#
# Design notes:
#   - Keeps dynamic_loss on pipeline_awesome for direct speech-preservation and
#     music-suppression supervision.
#   - Enables the improved proxy gates, but with milder mask sharpness,
#     slightly longer warmup, and less aggressive stage weights than the main
#     retuned profile.
#   - Introduces music a little earlier than the original profile, but later
#     and more cautiously than the retuned profile.
#   - Keeps the same majority-case dataset mix so comparisons stay focused on
#     loss scheduling rather than different sampling distributions.
#
# Usage:
#   python -m df_mlx.train_dynamic \
#     --run-config DeepFilterNet/df_mlx/configs/run_profiles/pipeline_awesome_gan_curriculum_clear_speech_conservative.toml

[dataset]
cache_dir = "~/DataDump/datasets/mlx_datastore"
p_background_music = 0.30
background_music_gain_range = [0, 16]

[training]
epochs = 120
batch_size = 24
learning_rate = 1e-4
learning_rate_min = 1e-7
weight_decay = 0.0
warmup_epochs = 5
patience = 0
grad_accumulation_steps = 2
max_grad_norm = 1.0
fp16 = true
seed = 42
music_start_epoch = 28
music_ramp_epochs = 14

[dataloader]
num_workers = 8
prefetch_size = 16
use_mlx_data = true

[checkpoint]
checkpoint_dir = "./checkpoints/gan_curriculum_clear_speech_conservative"
save_strategy = "epoch"
save_total_limit = 3
validate_every = 1
checkpoint_batches = 300
check_chkpts = false
resume = true
resume_data = true

[model]
backbone_type = "attention"
variant = "full"

[loss]
dynamic_loss = "pipeline_awesome"

[[loss.pipeline_stages]]
start_epoch = 0
name = "foundation"
awesome_loss_weight = 0.15
vad_loss_weight = 0.08
vad_speech_loss_weight = 0.05

[[loss.pipeline_stages]]
start_epoch = 28
name = "ramp"
awesome_loss_weight = 0.50
vad_loss_weight = 0.20
vad_speech_loss_weight = 0.16

[[loss.pipeline_stages]]
start_epoch = 54
name = "clarity_refine"
awesome_loss_weight = 0.80
vad_loss_weight = 0.30
vad_speech_loss_weight = 0.36

[[loss.pipeline_stages]]
start_epoch = 80
name = "gan_refine"
awesome_loss_weight = 0.68
vad_loss_weight = 0.24
vad_speech_loss_weight = 0.27

[loss.awesome]
loss_weight = 0.82
mask_sharpness = 5.25
warmup_steps = 2200
proxy_enabled = true

[loss.mrstft]
factor = 0.35
gamma = 0.7
f_complex = 0.15
fft_sizes = [512, 1024, 2048]
hop_sizes = [128, 256, 512]

[gan]
enabled = true
start_epoch = 80
ramp_epochs = 24
adv_weight = 0.08
fm_weight = 0.6
discriminator = "combined"
mpd_periods = [2, 3, 5, 7, 11]
msd_scales = 3
disc_lr = 2e-5
disc_weight_decay = 0.01
disc_grad_clip = 1.0
disc_update_freq = 2
disc_max_samples = 24000
mpd_channels = 16
msd_channels = 64
cache_gen_waveforms = true
disc_gradient_checkpoint = true
gen_gradient_checkpoint = true
eval_frequency = 6

[vad]
loss_weight = 0.3
threshold = 0.05
margin = 0.045
speech_loss_weight = 0.32
warmup_epochs = 5
snr_gate_db = -13.0
snr_gate_width = 6.0
band_low_hz = 300.0
band_high_hz = 3400.0
z_threshold = 0.0
z_slope = 1.0

[vad.eval]
mode = "silero"
every = 2
batches = 24
max_seconds = 0.0
silero_sample_rate = 16000

[vad.train]
prob = 0.1
every_steps = 2

[metrics]
eval_sisdr = false

[debug]
verbose = false
sync_mode = "fast"
debug_numerics = false
debug_numerics_fail_fast = true
debug_numerics_every = 1
debug_numerics_dump_dir = ""
debug_numerics_dump_arrays = false
debug_numerics_max_dumps = 5
nan_skip_batch = false

[enhance]
speech_boost_db = 4.25
speech_boost_threshold = 0.38
speech_boost_min_speech_ms = 235
speech_boost_min_silence_ms = 95
speech_boost_pad_ms = 35
speech_boost_ramp_ms = 9.0
speech_boost_peak_limit = 0.99
speech_boost_silero_sample_rate = 16000
